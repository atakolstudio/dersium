name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Download Gradle Wrapper
        run: |
          curl -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build_debug
        continue-on-error: true
        run: ./gradlew assembleDebug --no-configuration-cache --no-build-cache --stacktrace 2>&1 | tee build.log

      - name: Post build error to PR
        if: steps.build_debug.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ❌ assembleDebug failed"
            echo '```'
            grep -E "error:|FAILURE|e: |What went wrong|Caused by" build.log | tail -100
            echo '```'
            echo "<details><summary>Last 150 log lines</summary>"
            echo '```'
            tail -150 build.log
            echo '```'
            echo "</details>"
          } > comment.md
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @<(python3 -c "import json,sys; print(json.dumps({'body': open('comment.md').read()}))")

      - name: Fail job if build failed
        if: steps.build_debug.outcome == 'failure'
        run: exit 1

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dersium-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Decode Release Keystore
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build Release AAB
        if: github.ref == 'refs/heads/main'
        run: ./gradlew bundleRelease --no-configuration-cache --no-build-cache --stacktrace

      - name: Upload Release AAB
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dersium-release-aab-${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
